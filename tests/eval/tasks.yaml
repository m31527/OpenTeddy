# ── Multi-step ──────────────────────────────────────────────────────────────
- id: multi_region_report
  category: multi
  files: [sales.csv]
  goal: 用 sales.csv 算每個地區（region）的營收（qty × unit_price），存成 region.json（地區 → 營收），再寫一段 100 字以內的摘要到 summary.md，說哪一區最高。
