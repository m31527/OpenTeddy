- id: multi_fix_and_log
  category: multi
  files: [buggy.py, test_buggy.py]
  goal: 修好 buggy.py 讓 test_buggy.py 通過（不要改測試），再新增 CHANGELOG.md，寫一行說明改了什麼。
  checks:
    - {check: visible_tests, test: test_buggy.py}
    - {check: file_contains, path: CHANGELOG.md, all: ["median"]}
  seconds: 240

