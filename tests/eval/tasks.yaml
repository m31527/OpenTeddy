# ── The person's own browser (OpenTeddy extension) ──────────────────────────
# Run in a headless Chromium with the real extension on the test website
# (web_site.py; {site} is its address). browser.start opens that page as the
# tab the person is looking at; browser.confirm is how the rig answers when
# OpenTeddy asks before an action (allow / deny).
- id: web_cheapest
  category: web
  browser: {confirm: deny}
  goal: 到小熊商店 {site}/shop 搜尋「除濕機」，哪一台最便宜？多少錢？
  checks:
    - {check: answer_contains, all: ["北極熊", "3990"]}
    - {check: asked, max: 0}
  seconds: 120

- id: web_product_spec
  category: web
  browser: {confirm: deny}
  goal: 在小熊商店 {site}/shop 找「大雪 12L 除濕機」，告訴我它的能源效率等級和保固多久。
  checks:
    - {check: answer_contains, any: ["1 級", "1級", "一級"]}
    - {check: answer_contains, any: ["36 個月", "36個月", "3 年", "3年", "三年"]}
  seconds: 150

