# Delivery eval — 20 tasks, each judged automatically (checks.py).
# Answers come from make_fixtures.py; regenerate both together.
#
# files:   copied from fixtures/ into the task's own workspace
# checks:  all must pass for the task to count as delivered
# seconds: soft expectation, reported as a warning, never a failure

# ── Code ────────────────────────────────────────────────────────────────────
- id: code_slugify
  category: code
  goal: 在目前資料夾寫一個 slugify.py，裡面的函式 slugify(text) 把英文標題轉成網址用的 slug：全部小寫、空白和標點都換成 -、連續的 - 合併成一個、去掉頭尾的 -。
  checks:
    - {check: hidden_tests, test: test_slugify.py}
  seconds: 120

- id: code_parse_amount
  category: code
  goal: 寫一個 money.py，函式 parse_amount(text) 把金額字串轉成 float，要能處理 "1234"、"NT$1,234.50"、"新台幣 3,450 元"、"-$80" 這幾種寫法。
  checks:
    - {check: hidden_tests, test: test_parse_amount.py}
  seconds: 120

- id: code_fix_bug
  category: code
  files: [buggy.py, test_buggy.py]
  goal: buggy.py 的 median() 有 bug，test_buggy.py 有一個測試失敗。請修好 buggy.py，讓 test_buggy.py 全部通過，不要改測試檔。
  checks:
    - {check: visible_tests, test: test_buggy.py}
  seconds: 150

- id: code_word_count
  category: code
  goal: 寫一個 count_words.py：執行 python count_words.py 檔名，印出檔案裡出現最多次的前 3 個英文單字和次數，一行一個，格式「單字 次數」。
  checks:
    - {check: run_script, script: count_words.py, args: ["{hidden}/words.txt"], expect: ["apple\\D+4", "banana\\D+3", "cherry\\D+2"]}
  seconds: 120

# A display bug only seen by looking (2026-11-08): the snow canvas paints an
# opaque background over the game, and the emoji are drawn at 3% opacity.
# Twice OpenTeddy simulated the logic in Python, changed nothing, and said
# it was fixed. Passes only when the player can be seen on screen.
- id: code_fix_web_game
  category: code
  files: [xmas_game.html]
  goal: xmas_game.html 是一個網頁聖誕吞食者遊戲，按「開始遊戲」後畫面一直飄雪，看不到吞食者主角。請排查原因並修好 xmas_game.html。
  checks:
    - {check: screen_shows, path: xmas_game.html, actions: ["#start-btn"],
       rect_js: "(() => { const c = document.getElementById('game'), r = c.getBoundingClientRect(), s = r.width / (typeof COLS !== 'undefined' ? COLS : 24), h = snake[0]; return {x: r.left + h.x * s, y: r.top + h.y * s, w: s, h: s}; })()"}
  seconds: 300

