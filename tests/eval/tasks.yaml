- id: web_support_form
  category: web
  browser: {confirm: allow}
  goal: 幫我到 {site}/support 填客服表單：姓名王小明，電話 0912345678，問題類型選「冷氣維修」，問題描述寫「冷氣不冷，請派人來修」，然後送出。
